# Translation units assembled from the fragments of one upstream file each (tools/gen_fragment_units.py,
# card T6.4). A unit holds every [[fragment]] of its upstream_path in third_party/cycles/VENDORED.toml, in
# upstream order, after the includes below. A card that adds fragments whose code needs another header adds it
# to `includes`. node_registry = true appends painterly_cycles_shader_node_types() (src/cycles/shader_node_registry.h).

[unit.shader_nodes]
upstream_path = "scene/shader_nodes.cpp"
# scene/shader_nodes.cpp:5-41, keeping the headers that the T6.4 fragments need.
includes = [
  "scene/shader_nodes.h",
  "kernel/svm/node_types.h",
  "kernel/svm/types.h",
  "kernel/types.h",
  "scene/constant_fold.h",
  "scene/osl.h",
  "scene/scene.h",
  "scene/svm.h",
  "util/log.h",
  "util/math_base.h",
  "util/math_float3.h",
  "util/string.h",
  "util/transform.h",
  # T6.7: scene/shader_nodes.cpp:33, for PrincipledBsdfNode::has_surface_transparent
  # (bsdf_thin_glass_transmission_roughness, roughness_is_almost_specular).
  "kernel/closure/bsdf_microfacet.h",
  "kernel/svm/math_util.h",
  "<cassert>",
  "<limits>",
  "<mutex>",
]
node_registry = true

[unit.svm]
upstream_path = "scene/svm.cpp"
# scene/svm.cpp:5-27, keeping the headers that the T6.4 fragments need.
includes = [
  "<algorithm>",
  "<functional>",
  "scene/scene.h",
  "scene/shader.h",
  "scene/shader_graph.h",
  "scene/shader_nodes.h",
  "scene/svm.h",
  "kernel/svm/node_types.h",
  "util/log.h",
  "util/map.h",
  "util/math_float3.h",
  # T6.5: scene/svm.cpp:25-26, for SVMCompiler::compile (time_dt) and mark_nodes_requiring_derivatives (queue).
  "util/progress.h",
  "util/queue.h",
]
node_registry = false

[unit.time]
upstream_path = "util/time.cpp"
# util/time.cpp:5-7. Card T6.5: only time_dt(), which util/progress.h and util/time.h's scoped_timer call;
# util/time.cpp is not vendored whole.
includes = [
  "util/time.h",
  "<chrono>",
]
node_registry = false

[unit.transform]
upstream_path = "util/transform.cpp"
# util/transform.cpp:5-6. Card T6.6: only transform_transposed_inverse(), which TextureMapping::compute_transform()
# calls; util/transform.cpp is not vendored whole (card T3.2).
includes = [
  "util/transform.h",
  "util/projection.h",
]
node_registry = false

[unit.tables]
upstream_path = "scene/tables.cpp"
# scene/tables.cpp:5-11, keeping the headers that the T6.7 fragments need. Card T6.7: LookupTables without
# device_update() and device_free(), which need a Device.
includes = [
  "scene/tables.h",
  "scene/scene.h",
  "<cassert>",
  "<cstring>",
]
node_registry = false
