[build-system]
requires = ["scikit-build-core==1.1.1", "nanobind==3.1.0"]
build-backend = "scikit_build_core.build"

[project]
name = "painterly-core"
version = "0.1.0"
description = "Native core (_painterly) of the Painterly render engine for Blender"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]

[tool.scikit-build]
wheel.py-api = "cp312"            # stable ABI: one wheel serves Blender's Python 3.13
cmake.build-type = "Release"
build-dir = "build/{wheel_tag}"
[tool.scikit-build.cmake.define]
PAINTERLY_BUILD_TESTS = "OFF"
PAINTERLY_BUILD_ORACLE = "OFF"

[tool.uv]
package = false                   # `uv sync` installs deps only; the C++ module is built by `make build`
environments = ["python_version == '3.13'"]   # bpy==5.2.2 (group blender) supports only Python 3.13

[tool.uv.workspace]
members = ["analysis"]

[tool.uv.sources]
painterly-analysis = { workspace = true }

[dependency-groups]
dev = ["pytest>=8", "ruff", "clang-format==18.1.8", "numpy==2.3.4",
       "nanobind>=3.1", "scikit-build-core>=1.1", "cmake>=3.28", "ninja", "pyyaml"]
analysis = ["painterly-analysis"]
blender = ["bpy==5.2.2"]

[tool.pytest.ini_options]
testpaths = ["tests", "analysis/tests"]
addopts = "--import-mode=importlib"
markers = ["slow: takes more than ~10 s"]

[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "NPY"]

# Wheels (T2.4). cibuildwheel builds one CPython 3.13 wheel per platform; the abi3 tag (wheel.py-api above) makes it
# valid for CPython >= 3.12. The Embree source is cloned to .cache/src/embree by .github/workflows/wheels.yml, and the
# build compiles it from that local copy. CMake turns a relative untyped `-D` PATH value into an absolute one against
# the working directory, which is the project root under the build backend, so the relative path is the same on every
# platform. The path is relative to the project root, where the build backend runs, so it is the same on every
# platform. Compiled objects are never cached. Only cibuildwheel reads this table, so local builds fetch Embree.
[tool.cibuildwheel]
build = "cp313-*"
skip = "*-musllinux* *-win32 *_i686"
build-verbosity = 1
environment = { CMAKE_ARGS = "-DFETCHCONTENT_SOURCE_DIR_EMBREE=.cache/src/embree" }
test-requires = ["pytest>=8"]
# The tests import the installed wheel, not the build directory (tests/conftest.py, PAINTERLY_TEST_INSTALLED).
test-environment = { PAINTERLY_TEST_INSTALLED = "1" }
# The selftest criterion of tests/core/test_import.py (T2.5), then the symbol audit of the installed module. The path
# is passed as a raw string so that Windows backslashes survive the Python string literal.
test-command = "python -m pytest {project}/tests/core/test_import.py -q && python -c \"import subprocess, sys, _painterly; subprocess.run([sys.executable, r'{project}/tools/symbol_audit.py', _painterly.__file__], check=True)\""

[tool.cibuildwheel.linux]
manylinux-x86_64-image = "manylinux_2_28"
archs = ["x86_64"]
repair-wheel-command = "auditwheel repair -w {dest_dir} {wheel}"

[tool.cibuildwheel.macos]
archs = ["arm64"]
environment = { MACOSX_DEPLOYMENT_TARGET = "11.0", CMAKE_ARGS = "-DFETCHCONTENT_SOURCE_DIR_EMBREE=.cache/src/embree" }

[tool.cibuildwheel.windows]
archs = ["AMD64"]
